[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "film-recipe-lab"
version = "0.2.7"
description = "Local multi-camera RAW studio with an independent Fujifilm LUT adapter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
dependencies = ["rawpy>=0.25,<1", "numpy>=2,<3", "Pillow>=11,<13", "pydantic>=2,<3", "tifffile>=2024.8", "scipy>=1.14,<2"]

[project.optional-dependencies]
emulation = ["unicorn>=2.1,<3", "capstone>=5,<6"]
optics = ["lensfunpy>=1.17,<2"]
release = ["pyinstaller>=6.22,<7", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'"]

[project.scripts]
film-recipe-lab = "fuji_recipe_lab.__main__:main"

[tool.setuptools.package-data]
fuji_recipe_lab = ["static/*", "luts/*.json"]

[tool.setuptools.packages.find]
include = ["fuji_recipe_lab*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.cube", "*.bin", "*.DAT"]
